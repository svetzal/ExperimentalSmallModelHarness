[package]
name = "adaptive-agent-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
ignore = "0.4"
libc = "0.2"
mojentic = { git = "https://github.com/svetzal/mojentic-ru.git", rev = "6874a3d40d5be5e95dc9561bbabfb3c10fc0abb9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.0"
