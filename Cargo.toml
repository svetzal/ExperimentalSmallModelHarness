[package]
name = "microgentic"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
default-run = "microgentic"
description = "An adaptive coding agent optimized for small models"
license = "MIT"
repository = "https://github.com/svetzal/microgentic"

# Keep the library import and historical executable during the migration.
[lib]
name = "adaptive_agent_harness"

[[bin]]
name = "microgentic"
path = "src/main.rs"

[[bin]]
name = "adaptive-agent-harness"
path = "src/bin/legacy.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste", "windows"] }
futures = "0.3"
ignore = "0.4"
libc = "0.2"
mojentic = { git = "https://github.com/svetzal/mojentic-ru.git", rev = "4ca1ed279c02eab37827a1ed07c30e961155ecf3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.0"
unicode-width = "0.2"
