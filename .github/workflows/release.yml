name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    # The reused CI declares a Pages deploy job. It only runs for pushes to
    # main, but a caller must still allow the permissions it requests.
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      package: true
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: microgentic-*
          merge-multiple: true
      - name: Publish versioned archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum dist/microgentic-*.tar.gz > dist/SHA256SUMS
          sed -i 's|  dist/|  |' dist/SHA256SUMS
          python3 scripts/release-notes.py "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --title "Microgentic $RELEASE_TAG" --notes-file release-notes.md dist/*
