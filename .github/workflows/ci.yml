name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check and build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            archive: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libssl-dev
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Collection checks
        run: python3 -m unittest discover -s benchmarks -p 'test_collection_validation.py'
      - name: Build release binaries with source provenance
        env:
          MICROGENTIC_RELEASE_REVISION: ${{ github.sha }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export OPENSSL_STATIC=1
            export OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu
          fi
          cargo build --locked --release --bins
      - name: Check installed binary outside its source checkout
        run: python3 scripts/smoke-installed.py target/release/microgentic "${{ github.sha }}"
      - name: Check compatibility executable
        run: target/release/adaptive-agent-harness --help
      - name: Package binaries
        if: inputs.package
        run: python3 scripts/package-release.py "${{ github.ref_name }}" "${{ matrix.archive }}" "${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: microgentic-${{ matrix.archive }}
          path: dist/microgentic-*.tar.gz
          if-no-files-found: error
