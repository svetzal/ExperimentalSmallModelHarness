<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TRANSCRIPT_TITLE__</title>
<style>
:root{--paper:#f3efe4;--surface:#fffdf7;--ink:#171916;--muted:#65675f;--line:#c8c0af;--dark:#11130f;--red:#a33b2f;--amber:#a66519;--green:#2f684f;--blue:#335f7b;--s1:.4rem;--s2:.65rem;--s3:1rem;--s4:1.5rem;--s5:2.3rem;--shadow:0 14px 40px rgba(34,29,19,.12)}
*{box-sizing:border-box}html{background:var(--paper);color:var(--ink);scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:"Avenir Next Condensed","Gill Sans",sans-serif;background-image:linear-gradient(rgba(61,57,45,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(61,57,45,.035) 1px,transparent 1px);background-size:24px 24px}button,input{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.rail{position:sticky;top:0;height:100vh;padding:var(--s4);overflow:auto;background:var(--dark);color:#e8e4d8}.brand{border-top:6px solid var(--red);padding-top:var(--s3);margin-bottom:var(--s5)}.eyebrow{font:700 .7rem/1.2 "Courier New",monospace;letter-spacing:.17em;text-transform:uppercase;color:#aaa99f}.brand h1{font:600 1.5rem/1.05 "Iowan Old Style","Palatino Linotype",serif;margin:.45rem 0}.brand p{color:#aaa99f;font-size:.82rem;line-height:1.45;margin:0}.session-nav{display:grid;gap:var(--s2)}.session-button{width:100%;min-height:54px;text-align:left;border:1px solid #383b34;border-left:4px solid transparent;background:#1b1e19;padding:.7rem .75rem;cursor:pointer}.session-button:hover{background:#252921}.session-button[aria-current=true]{border-left-color:var(--red);background:#2a2d25}.session-button strong{display:block;color:#f8f4e8;font-size:.83rem}.session-button span{color:#a8a99f;font:600 .69rem/1.4 "Courier New",monospace}.nav-result{float:right;padding:.08rem .35rem;background:#555;color:#fff}.nav-result.pass{background:var(--green)}.nav-result.fail{background:var(--red)}.rail-footer{margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid #383b34;color:#989a90;font-size:.72rem;line-height:1.45}main{min-width:0;padding:clamp(1rem,3vw,3.5rem)}.mast{max-width:1180px;margin:0 auto var(--s4);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4)}.mast h2{font:600 clamp(2rem,5vw,4.8rem)/.92 "Iowan Old Style","Palatino Linotype",serif;margin:.2rem 0 .55rem;letter-spacing:-.035em}.mast-copy{max-width:60ch;color:var(--muted);line-height:1.5;margin:0}.controls{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:flex-end;min-width:280px}.control,.search{min-height:40px;border:1px solid #9e9584;background:rgba(255,253,247,.8);padding:.55rem .7rem}.control{cursor:pointer;font-weight:700;font-size:.76rem}.control:hover{background:var(--surface)}.search{width:220px}.content{max-width:1180px;margin:0 auto}.summary{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #9e9584;box-shadow:var(--shadow);background:var(--surface);margin-bottom:var(--s4)}.stat{padding:var(--s3);border-right:1px solid var(--line);min-width:0}.stat:last-child{border-right:0}.stat b{display:block;font:600 1.5rem/1 "Iowan Old Style","Palatino Linotype",serif;overflow:hidden;text-overflow:ellipsis}.stat span{display:block;color:var(--muted);font:700 .66rem/1.3 "Courier New",monospace;text-transform:uppercase;letter-spacing:.09em;margin-top:.45rem}.status-pass{color:var(--green)}.status-fail{color:var(--red)}.notice{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3);margin-bottom:var(--s4);border-left:5px solid var(--amber);background:#f8edcf}.notice strong{min-width:120px}.notice p{margin:0;line-height:1.45;color:#514a38}.section-head{display:flex;justify-content:space-between;gap:var(--s3);align-items:end;border-bottom:4px solid var(--ink);margin:var(--s5) 0 var(--s3);padding-bottom:.6rem}.section-head h3{font:600 1.8rem "Iowan Old Style","Palatino Linotype",serif;margin:0}.section-head span{color:var(--muted);font-size:.76rem}.turn{display:grid;grid-template-columns:88px minmax(0,1fr);position:relative;margin-bottom:var(--s4)}.turn:before{content:"";position:absolute;left:73px;top:33px;bottom:-28px;width:1px;background:#9e9584}.turn:last-child:before{display:none}.turn-label{padding-top:.85rem;font:700 .7rem/1.35 "Courier New",monospace;text-transform:uppercase;color:var(--muted)}.turn-label b{display:block;color:var(--ink);font-size:.86rem}.call{background:rgba(255,253,247,.94);border:1px solid var(--line);margin-bottom:var(--s2);box-shadow:0 3px 12px rgba(34,29,19,.055)}.call[open]{border-color:#9e9584}.call>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:center;min-height:68px;padding:var(--s3)}.call>summary::-webkit-details-marker{display:none}.call>summary:hover{background:#faf6eb}.call-index{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 .7rem "Courier New",monospace}.call-title{min-width:0}.call-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.call-title span{display:block;color:var(--muted);font-size:.78rem;margin-top:.24rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chips{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:flex-end}.chip{padding:.2rem .42rem;border:1px solid var(--line);font:700 .64rem/1.2 "Courier New",monospace;text-transform:uppercase;background:var(--paper)}.chip.bad{border-color:#d4a198;color:var(--red);background:#fff0ec}.chip.good{color:var(--green);border-color:#9fc4b3;background:#edf8f1}.call-body{border-top:1px solid var(--line);padding:var(--s3)}.request-panel{margin-bottom:var(--s3);padding:var(--s3);background:#edf1eb;border-left:5px solid var(--green)}.request-panel.legacy{background:#f8edcf;border-left-color:var(--amber)}.request-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s2)}.request-head h4,.panel h4{margin:0 0 .55rem;font:700 .7rem "Courier New",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.request-head h4{margin:0;color:var(--ink)}.request-head span{color:var(--muted);font-size:.76rem}.message-list{display:grid;gap:var(--s2)}.message{border:1px solid var(--line);background:var(--surface)}.message>summary{cursor:pointer;min-height:42px;padding:.65rem .75rem;font:700 .7rem/1.35 "Courier New",monospace;text-transform:uppercase}.continuity{display:inline-block;margin-left:.45rem;padding:.12rem .38rem;border-radius:99px;background:#e8e1d2;color:var(--muted)}.continuity.new,.continuity.changed{background:#dbeadf;color:var(--green)}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.42fr);gap:var(--s3)}.panel{min-width:0}.prose,.code{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:var(--s3);border:1px solid var(--line);background:#f7f2e7;max-height:520px;overflow:auto}.prose{font:400 .9rem/1.55 "Iowan Old Style","Palatino Linotype",serif}.code{font:400 .75rem/1.55 "Courier New",monospace;background:#20231e;color:#e7e2d5}.message .code{border:0;border-top:1px solid var(--line)}.empty{color:var(--muted);font-style:italic;padding:var(--s3);border:1px dashed #9e9584}.exchange-effects{margin:-.2rem 0 var(--s3) 18px;padding:.4rem 0 0 30px;border-left:1px solid #9e9584;display:grid;gap:var(--s2)}.flow-label{color:var(--muted);font:700 .64rem/1.3 "Courier New",monospace;letter-spacing:.08em;text-transform:uppercase;margin-top:.25rem}.tool,.harness-event{border-left:4px solid var(--blue);background:#eef3f3;padding:.75rem}.tool.bad,.harness-event.danger{border-left-color:var(--red);background:#fff0ec}.tool.good,.harness-event.success{border-left-color:var(--green);background:#edf8f1}.harness-event.warning{border-left-color:var(--amber);background:#f8edcf}.tool-head,.event-head{display:flex;justify-content:space-between;gap:var(--s2);align-items:baseline}.tool-head strong,.event-head strong{font-size:.82rem}.time{color:var(--muted);font:600 .66rem "Courier New",monospace;white-space:nowrap}.tool p,.harness-event p{margin:.3rem 0 0;color:#4e504a;font-size:.78rem;line-height:1.45}.subdetail{margin-top:.55rem}.subdetail summary{cursor:pointer;font:700 .68rem "Courier New",monospace;color:var(--blue);min-height:28px}.legacy-setup details{border:1px solid var(--line);background:var(--surface)}.legacy-setup details>summary{cursor:pointer;padding:var(--s3);font-weight:700}.hidden{display:none!important}.search-hit{outline:3px solid #d8a634;outline-offset:2px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{position:relative;height:auto}.session-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.mast{display:block}.controls{justify-content:flex-start;margin-top:var(--s3)}.summary{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}.detail-grid{grid-template-columns:1fr}}
@media(max-width:560px){.session-nav{grid-template-columns:1fr}main{padding:var(--s3)}.summary{grid-template-columns:1fr}.stat{border-right:0}.turn{grid-template-columns:1fr}.turn:before{display:none}.turn-label{padding:.4rem 0}.call>summary{grid-template-columns:auto minmax(0,1fr)}.chips{grid-column:1/-1;justify-content:flex-start}.search{width:100%}.notice{display:block}.notice strong{display:block;margin-bottom:.4rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="rail"><div class="brand"><div class="eyebrow">Adaptive harness / flight recorder</div><h1>__TRANSCRIPT_TITLE__</h1><p>What the model received, produced, called, and learned—kept in causal order.</p></div><nav id="sessionNav" class="session-nav" aria-label="Sessions"></nav><div class="rail-footer">Keys: <b>/</b> search · <b>[</b>/<b>]</b> sessions · <b>E</b> expand · <b>C</b> collapse<br><br>Everything needed to inspect this report is embedded in this HTML file.</div></aside>
<main><header class="mast"><div><div class="eyebrow" id="sessionEyebrow"></div><h2 id="sessionTitle"></h2><p class="mast-copy" id="sessionCopy"></p></div><div class="controls"><input id="search" class="search" type="search" placeholder="Search this session…" aria-label="Search transcript"><button id="expandAll" class="control">Expand all</button><button id="collapseAll" class="control">Collapse all</button></div></header><div id="app" class="content"></div></main>
</div>
<script id="transcriptData" type="application/json">__TRANSCRIPT_DATA__</script>
<script>
const DATA=JSON.parse(document.getElementById('transcriptData').textContent);let active=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=s=>{if(s==null)return '—';if(s<60)return `${s.toFixed(1)}s`;const total=Math.round(s);return `${Math.floor(total/60)}m ${total%60}s`};
const fmtNum=n=>new Intl.NumberFormat().format(n||0);const outcome=s=>s.evidence.reward==='1'?'pass':s.evidence.reward?'fail':'unknown';
function raw(payload,label='Raw payload'){return `<details class="subdetail"><summary>${label}</summary><pre class="code">${esc(JSON.stringify(payload,null,2))}</pre></details>`}
function nav(){document.getElementById('sessionNav').innerHTML=DATA.sessions.map((s,i)=>{const total=s.evidence.passed+s.evidence.failed;return `<button class="session-button" data-index="${i}" aria-current="${i===active}"><span class="nav-result ${outcome(s)}">${total?s.evidence.passed+'/'+total:'—'}</span><strong>${esc(s.id)}</strong><span>${fmtTime(s.runtime_seconds)} · ${s.calls.length} calls</span></button>`}).join('');document.querySelectorAll('.session-button').forEach(b=>b.onclick=()=>select(+b.dataset.index))}
function tool(t){const state=t.success===false?'bad':t.success===true?'good':'';return `<article class="tool ${state} searchable"><div class="tool-head"><strong>→ ${esc(t.name)}</strong><span class="time">+${fmtTime(t.at)}</span></div><p>${esc(t.summary)}</p>${raw(t.payload,'Arguments & result')}</article>`}
function event(e){return `<article class="harness-event ${e.severity} searchable"><div class="event-head"><strong>${esc(e.title)}</strong><span class="time">+${fmtTime(e.at)}</span></div>${e.summary?`<p>${esc(e.summary)}</p>`:''}${raw(e.payload)}</article>`}
function request(c){if(!c.request)return `<section class="request-panel legacy"><div class="request-head"><h4>What the model received</h4><span>Exact request unavailable</span></div><div class="empty">Only component measurements were retained. Missing message and follow-up text cannot be reconstructed faithfully.</div>${raw(c.context.components||[],'Measured context components')}</section>`;const changed=c.request_messages.filter(m=>m.continuity==='new'||m.continuity==='changed').length;return `<section class="request-panel"><div class="request-head"><h4>What the model received</h4><span>${c.request_messages.length} exact messages · ${changed} new or changed</span></div><div class="message-list">${c.request_messages.map(m=>`<details class="message searchable"><summary>#${m.index} · ${esc(m.role||'unknown')} <span class="continuity ${m.continuity}">${esc(m.continuity)}</span> · ${esc(m.inclusion_reason)}</summary><pre class="code">${esc(m.content||'[no text content]')}${m.tool_calls?`\n\nTOOL CALLS\n${esc(JSON.stringify(m.tool_calls,null,2))}`:''}</pre></details>`).join('')}</div>${raw({tools:c.request.tools,completion:c.request.completion},'Active tools & completion settings')}</section>`}
function call(c){const thought=(c.reasoning||'').replace(/\s+/g,' ').trim();const pct=((c.context.utilization||0)*100).toFixed(1);return `<details class="call searchable"><summary><span class="call-index">${c.index}</span><span class="call-title"><strong>Model call · turn ${c.turn}, depth ${c.depth}</strong><span>${esc(thought.slice(0,170)||c.assistant||'No visible model text')}${thought.length>170?'…':''}</span></span><span class="chips"><span class="chip ${c.request?'good':'bad'}">${c.request?'exact input':'legacy input'}</span><span class="chip">${fmtNum(c.reasoning_reported_chars)} thought</span><span class="chip">${fmtNum((c.response_tool_calls||[]).length)} tools</span><span class="chip">${pct}% ctx</span></span></summary><div class="call-body">${request(c)}<div class="detail-grid"><section class="panel"><h4>Verbatim streamed reasoning ${c.reasoning_complete?'':'· partial previews'}</h4>${c.reasoning?`<pre class="prose">${esc(c.reasoning)}</pre>`:'<div class="empty">No reasoning text was retained for this call.</div>'}${c.assistant?`<h4 style="margin-top:1rem">Assistant-visible text</h4><pre class="prose">${esc(c.assistant)}</pre>`:''}${(c.response_tool_calls||[]).length?`<h4 style="margin-top:1rem">Normalized response tool calls</h4><pre class="code">${esc(JSON.stringify(c.response_tool_calls,null,2))}</pre>`:''}</section><aside class="panel"><h4>Call envelope</h4><pre class="code">${esc(JSON.stringify({turn:c.turn,depth:c.depth,at:c.at,response:c.response,context:c.context},null,2))}</pre></aside></div></div></details>`}
function exchange(c){const effects=[];if(c.tools.length)effects.push(`<div class="flow-label">Tool effects returned to the harness</div>${c.tools.map(tool).join('')}`);if(c.harness.length)effects.push(`<div class="flow-label">Harness decisions before the next call</div>${c.harness.map(event).join('')}`);return call(c)+(effects.length?`<div class="exchange-effects">${effects.join('')}</div>`:'')}
function legacy(s){if(s.exact_request_trace||!s.legacy_initial_user_message)return '';return `<section class="legacy-setup"><div class="section-head"><h3>Legacy run setup</h3><span>Best available initial user message</span></div><details><summary>User · retained initial-context event</summary><pre class="code">${esc(s.legacy_initial_user_message)}</pre></details></section>`}
function timeline(s){const groups=new Map();s.calls.forEach(c=>{if(!groups.has(c.turn))groups.set(c.turn,[]);groups.get(c.turn).push(c)});return `<section><div class="section-head"><h3>Causal exchange timeline</h3><span>Input → model → tools → harness decision → next input</span></div>${[...groups].map(([turn,calls])=>`<div class="turn"><div class="turn-label"><b>Turn ${turn}</b>${calls.length} call${calls.length===1?'':'s'}</div><div>${calls.map(exchange).join('')}</div></div>`).join('')}</section>`}
function evidence(s){const total=s.evidence.passed+s.evidence.failed;return `<section><div class="section-head"><h3>Independent evidence</h3><span>Optional external verification</span></div><details class="call"><summary><span class="call-index">V</span><span class="call-title"><strong>${total?s.evidence.passed+' passed · '+s.evidence.failed+' failed':'No evidence supplied'}</strong><span>Open for complete external output</span></span></summary><div class="call-body"><pre class="code">${esc(s.evidence.output)}</pre></div></details></section>`}
function render(){const s=DATA.sessions[active];document.getElementById('sessionEyebrow').textContent=`${s.model||'unknown model'} · ${s.profile||'unknown profile'}`;document.getElementById('sessionTitle').textContent=s.id;document.getElementById('sessionCopy').textContent=s.hard_stop?`Stopped by ${s.hard_stop.title.toLowerCase()}. ${s.final_summary}`:`Finished: ${s.final_summary||'no terminal summary'}`;const total=s.evidence.passed+s.evidence.failed;document.getElementById('app').innerHTML=`<section class="summary"><div class="stat"><b class="status-${outcome(s)}">${total?s.evidence.passed+' / '+total:'—'}</b><span>Independent checks</span></div><div class="stat"><b>${fmtTime(s.runtime_seconds)}</b><span>Runtime</span></div><div class="stat"><b>${s.turns} / ${s.calls.length}</b><span>Turns / calls</span></div><div class="stat"><b>${fmtNum(s.reasoning_chars)}</b><span>Thinking chars</span></div><div class="stat"><b>${s.request_snapshot_count} / ${s.calls.length}</b><span>Exact inputs</span></div></section><aside class="notice"><strong>Trace fidelity</strong><p>${esc(s.fidelity_notes.join(' · '))}</p></aside>${legacy(s)}${timeline(s)}${evidence(s)}`;nav();search()}
function select(i){active=(i+DATA.sessions.length)%DATA.sessions.length;render();window.scrollTo({top:0,behavior:'smooth'})}function search(){const q=document.getElementById('search').value.trim().toLowerCase();document.querySelectorAll('.searchable').forEach(el=>{const hit=!q||el.textContent.toLowerCase().includes(q);el.classList.toggle('hidden',!hit);el.classList.toggle('search-hit',!!q&&hit)})}
document.getElementById('search').addEventListener('input',search);document.getElementById('expandAll').onclick=()=>document.querySelectorAll('#app details').forEach(d=>d.open=true);document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('#app details').forEach(d=>d.open=false);document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='/'){e.preventDefault();document.getElementById('search').focus()}if(e.key==='[')select(active-1);if(e.key===']')select(active+1);if(e.key.toLowerCase()==='e')document.getElementById('expandAll').click();if(e.key.toLowerCase()==='c')document.getElementById('collapseAll').click()});render();
</script>
</body>
</html>
